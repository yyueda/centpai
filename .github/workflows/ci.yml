name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Check formatting with black
        run: poetry run black --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run pytest

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Generate .env file
        run: |
          cat > .env << EOF
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          WEBHOOK_URL=${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}
          GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          EOF

      - name: Upload files to S3
        env:
          BUCKET: ${{ secrets.DEPLOY_BUCKET }}
        run: |
          tar -czf deploy.tar.gz \
            app/ Dockerfile pyproject.toml poetry.lock \
            docker-compose.prod.yml config.alloy loki-config.yaml nginx.conf .env
          aws s3 cp deploy.tar.gz s3://${BUCKET}/centpai/deploy.tar.gz

      - name: Deploy on EC2 via SSM
        env:
          BUCKET: ${{ secrets.DEPLOY_BUCKET }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"mkdir -p /home/ec2-user/centpai\",
              \"aws s3 cp s3://${BUCKET}/centpai/deploy.tar.gz /home/ec2-user/centpai/deploy.tar.gz\",
              \"tar -xzf /home/ec2-user/centpai/deploy.tar.gz -C /home/ec2-user/centpai/\",
              \"cd /home/ec2-user/centpai && docker compose -f docker-compose.prod.yml up -d --build\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
